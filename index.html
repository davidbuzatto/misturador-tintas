<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misturador de Tintas</title>
<!-- Ícone: paleta de cores (SVG embutido em base64, sem arquivo externo) -->

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="theme-color" content="#c2410c">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/main.js"></script>
<script>
// app instalável e disponível sem rede: só registra em contexto seguro (https ou localhost)
if ('serviceWorker' in navigator && window.isSecureContext) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</head>
<body>
<a class="skip" href="#main" data-i18n="a11y.skip">Ir para o conteúdo</a>
<header>
  <div class="hrow">
    <h1 data-i18n="app.title">Misturador de Tintas</h1>
    <div class="hctl">
      <button class="sm" id="btnCatalog" data-i18n="cat.button" data-i18n-title="cat.button.title">Catálogo completo</button>
      <button class="sm" id="btnReset" data-i18n="reset.button" data-i18n-title="reset.title">Restaurar configurações</button>
      <label class="muted lang"><span data-i18n="lang.label">Idioma</span> <select id="lang"></select></label>
    </div>
  </div>
  <p class="sub" data-i18n-html="app.subtitle"></p>
  <details class="how" id="how">
    <summary data-i18n="help.title">Como usar, passo a passo</summary>
    <p data-i18n-html="help.intro"></p>
    <ol>
      <li data-i18n-html="help.step1"></li>
      <li data-i18n-html="help.step2"></li>
      <li data-i18n-html="help.step3"></li>
      <li data-i18n-html="help.step4"></li>
      <li data-i18n-html="help.step5"></li>
      <li data-i18n-html="help.step6"></li>
      <li data-i18n-html="help.step7"></li>
    </ol>
    <p class="muted" data-i18n="help.tip"></p>
    <div class="row">
      <button class="pri" id="btnExample" data-i18n="help.try">Fazer o exemplo para mim</button>
      <span class="muted" id="exMsg" aria-live="polite"></span>
    </div>
    <p class="muted" data-i18n="help.local"></p>
    <p class="muted" data-i18n="help.limits"></p>
  </details>
  <p class="warn" id="erro" role="alert" hidden></p>
</header>
<main id="main">
  <section class="card" aria-labelledby="h-mix">
    <h2 id="h-mix" data-i18n="card.mix">1 · Mistura</h2>
    <p class="muted help" data-i18n="mix.help"></p>
    <div class="row" style="margin-bottom:6px">
      <label class="muted"><span data-i18n="mix.set.label">tintas</span> <select id="ingSet" data-i18n-title="mix.set.title"></select></label>
      <span class="muted" id="ingSetInfo"></span>
    </div>
    <div id="ings"></div>
    <div class="row" style="margin-top:10px">
      <button class="pri" id="btnAdd" data-i18n="mix.add">+ adicionar tinta</button>
      <button id="btnNorm" data-i18n="mix.norm" data-i18n-title="mix.norm.title">normalizar 100%</button>
      <button id="btnClear" data-i18n="mix.clear">limpar</button>
      <span style="flex:1"></span>
      <label class="muted"><span data-i18n="mix.total">total</span> <input type="number" id="total" min="0.5" step="0.5" value="10" style="width:70px" data-i18n-title="mix.total.title"> ml</label>
    </div>
    <div class="muted" id="sumInfo" style="margin-top:6px" aria-live="polite"></div>
    <details style="margin-top:8px"><summary data-i18n="mix.model.summary">Modelo de mistura e força de tingimento</summary>
      <div style="margin-top:8px" class="row">
        <label><span data-i18n="mix.model.label">modelo</span>
          <select id="model">
            <option value="km" data-i18n="model.km"></option>
            <option value="kmeq" data-i18n="model.kmeq"></option>
            <option value="lin" data-i18n="model.lin"></option>
            <option value="srgb" data-i18n="model.srgb"></option>
          </select>
        </label>
      </div>
      <p class="muted" data-i18n-html="mix.model.help"></p>
    </details>
  </section>

  <section class="card" aria-labelledby="h-target">
    <h2 id="h-target" data-i18n="card.target">2 · Cor-alvo</h2>
    <p class="muted help" data-i18n="target.help"></p>
    <div class="tabs" id="tgtTabs"></div>
    <div class="tabs sub" id="tgtLines" style="display:none"></div>
    <div class="row" style="margin-bottom:8px"><input type="text" id="tgtSearch" data-i18n-placeholder="target.search" data-i18n-aria-label="target.search" style="flex:1;min-width:140px"><label class="muted"><input type="checkbox" id="tgtFinish"> <span data-i18n="target.showFinish">mostrar acabamento</span></label><span id="freeBox" style="display:none"><input type="color" id="freeColor" value="#808080" data-i18n-aria-label="target.free.color"> <input type="text" id="freeHex" value="#808080" style="width:90px" data-i18n-aria-label="target.free.hex"></span></div>
    <div class="grid" id="tgtGrid"></div>
  </section>

  <section class="card full" id="resSec" aria-labelledby="h-result">
    <h2 id="h-result" data-i18n="card.result">3 · Resultado</h2>
    <div class="resgrid" style="display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px">
      <div>
        <div class="big"><div id="bigT"></div><div id="bigM"></div></div>
        <div class="cap"><span id="capT"></span><span id="capM"></span></div>
        <div class="row" style="margin-top:10px"><span class="de" id="deVal">–</span><span id="deTxt" class="muted"></span></div>
        <div class="row" style="margin-top:10px"><button id="btnSave" class="pri" data-i18n="result.save">salvar receita</button><button id="btnSug" data-i18n="result.suggest">sugerir mistura automática</button>
          <label class="muted"><span data-i18n="result.upto">até</span> <select id="maxN"><option>1</option><option>2</option><option selected>3</option><option>4</option></select> <span data-i18n="result.paints">tintas</span></label>
          <label class="muted"><input type="checkbox" id="onlyOwn"> <span data-i18n="result.onlyOwn">só as que tenho</span></label></div>
        <div id="sugOut" aria-live="polite"></div>
      </div>
      <div>
        <table><thead><tr><th data-i18n="result.col.model">modelo</th><th data-i18n="result.col.color">cor</th><th data-i18n="result.col.de">ΔE00</th></tr></thead><tbody id="cmp"></tbody></table>
        <p class="muted" style="margin-top:8px" data-i18n-html="result.scale"></p>
        <div class="warn" data-i18n="result.warn"></div>
      </div>
    </div>
  </section>

  <section class="card full" id="eqSec" aria-labelledby="h-eq">
    <h2 id="h-eq" data-i18n="card.equiv">4 · Equivalentes em outras marcas</h2>
    <div class="row" style="margin-bottom:8px">
      <label class="muted"><span data-i18n="eq.from">a partir da</span>
        <select id="eqFrom"><option value="target" data-i18n="eq.from.target"></option><option value="mix" data-i18n="eq.from.mix"></option></select>
      </label>
      <span class="muted" id="eqInfo"></span>
      <span class="muted" style="flex:1;text-align:right" data-i18n="eq.hint"></span>
    </div>
    <p class="muted help" data-i18n="eq.help"></p>
    <div class="eqgrid" id="eqGrid"></div>
  </section>

  <section class="card full" aria-labelledby="h-rec">
    <h2 id="h-rec" data-i18n="card.recipes">5 · Receitas salvas</h2>
    <p class="muted help" data-i18n="rec.help"></p>
    <div id="hist"></div>
    <div class="row" style="margin-top:8px"><button id="btnExp" data-i18n="rec.export" data-i18n-title="rec.export.title">exportar backup</button><button id="btnImp" data-i18n="rec.import" data-i18n-title="rec.import.title">importar backup</button><input type="file" id="fileImp" accept=".json" style="display:none" data-i18n-aria-label="rec.import"><span class="muted" id="bkMsg" aria-live="polite"></span></div>
  </section>

  <section class="card full about" id="about" aria-labelledby="h-about">
    <h2 id="h-about" data-i18n="about.title">Sobre</h2>
    <p data-i18n-html="about.credits"></p>
    <p class="muted" data-i18n-html="about.license"></p>
    <p class="muted" data-i18n="about.data"></p>
    <details><summary data-i18n="about.refs.title">Para saber mais</summary>
      <p class="muted" data-i18n="about.refs.intro"></p>
      <ul id="refList"></ul>
    </details>
  </section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="box">
  <div class="row"><b style="flex:1" id="mTitle"></b><button id="mClose" data-i18n="common.close">fechar</button></div>
  <div class="row" style="margin:8px 0"><input type="text" id="pSearch" data-i18n-placeholder="picker.search" data-i18n-aria-label="picker.search" style="flex:1"><label class="muted"><input type="checkbox" id="pOwn"> <span data-i18n="result.onlyOwn">só as que tenho</span></label></div>
  <p class="muted" style="margin:0 0 6px" data-i18n="picker.help"></p>
  <div class="row" style="margin:0 0 8px"><button class="sm" id="pMarkAll"></button><button class="sm" id="pUnmarkAll"></button><span class="muted" id="pOwnCount" aria-live="polite"></span></div>
  <div class="grid" id="pGrid" style="max-height:60vh"></div>
</div></div>

<div class="modal" id="catModal" role="dialog" aria-modal="true" aria-labelledby="catTitle"><div class="box wide">
  <div class="row"><b style="flex:1" id="catTitle" data-i18n="cat.title">Catálogo completo</b><button id="catClose" data-i18n="common.close">fechar</button></div>
  <p class="muted" style="margin:6px 0" data-i18n="cat.help"></p>
  <div class="tabs" id="catTabs" role="group" data-i18n-aria-label="cat.tabs"></div>
  <div class="tabs sub" id="catLines" role="group" data-i18n-aria-label="cat.lines"></div>
  <div class="tabs sub" id="catFinish" role="group" data-i18n-aria-label="cat.finish"></div>
  <div class="row" style="margin:6px 0"><input type="text" id="catSearch" data-i18n-placeholder="cat.search" data-i18n-aria-label="cat.search" style="flex:1"><span class="muted" id="catCount" aria-live="polite"></span></div>
  <div class="catdet" id="catDet" aria-live="polite"></div>
  <div class="grid" id="catGrid" style="max-height:42vh"></div>
</div></div>
</body>
</html>
